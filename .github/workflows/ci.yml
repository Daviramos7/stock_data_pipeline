name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Compilar dashboard
        run: python -m py_compile dashboard.py

      - name: Importar bibliotecas
        run: python -c "import streamlit, pandas, numpy, yfinance, plotly; print('ok')"

      - name: Rodar testes
        run: python -m pytest -q

  dbt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SILVER_PATH: ${{ github.workspace }}/data/amostra/cotacoes.parquet
      DUCKDB_PATH: ${{ github.workspace }}/data/amostra/warehouse.duckdb
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependências do pipeline
        run: |
          pip install -r requirements-pipeline.txt -r requirements-dev.txt
          pip install -e .

      - name: Testes (inclui conferência dos seeds)
        run: python -m pytest -q

      - name: Gerar silver sintético (sem rede)
        run: python scripts/gerar_silver_amostra.py --saida "$SILVER_PATH"

      - name: dbt build
        working-directory: dbt
        run: |
          # O silver sintético para em 2026: o teste de freshness (fato_desatualizado) usa
          # como "hoje" o dia seguinte ao último pregão da bolsa que termina antes.
          hoje=$(python -c "import os, pandas as pd, datetime as dt; d = pd.read_parquet(os.environ['SILVER_PATH']).groupby('ticker')['data'].max().min(); print(pd.Timestamp(d).date() + dt.timedelta(days=1))")
          echo "hoje=$hoje"
          dbt build --profiles-dir . --vars "{hoje: '$hoje'}"

      - name: Exportar gold
        run: python scripts/exportar_gold.py --db "$DUCKDB_PATH" --saida data/amostra/gold
